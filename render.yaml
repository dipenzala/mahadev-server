services:
  - type: web
    name: mahadev-server
    env: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: MASTER_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
